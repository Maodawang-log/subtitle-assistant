<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BiliScript 日语学习设置</title><link rel="stylesheet" href="recorder.css"><main><small>BILISCRIPT · 日语学习快照</small><h1>只在你想学习时运行。</h1><p><label><input id="autoStart" type="checkbox"> 打开新视频时自动开启学习（默认关闭）</label></p><p><label><input id="autoTranslate" type="checkbox"> 学习开启后，自动翻译当前与下一句（使用下方接口，可能计费）</label></p><p>本地 Whisper 识别不需要文字模型 Key。未配置时仍可识别日语、查本地词典、练句子和录音。</p><p><label>本地日语识别模型 <select id="asrModel"><option value="small">Whisper small（默认，较快）</option><option value="medium">Whisper medium（已下载，可选）</option></select></label></p><label>OpenAI 兼容 Base URL<br><input id="baseUrl" type="url" style="width:100%;padding:10px" placeholder="https://api.deepseek.com"></label><p><label>模型名<br><input id="model" style="width:100%;padding:10px" placeholder="deepseek-v4-flash"></label></p><p><label>API Key（仅存本浏览器，不上传日志）<br><input id="apiKey" type="password" autocomplete="off" style="width:100%;padding:10px" placeholder="留空保持已保存的 Key"></label></p><div class="row"><button id="save">保存设置</button><button id="health">检查本地识别服务</button></div><p id="status" role="status"></p><p class="note">本地服务：127.0.0.1:18766。首次启动需载入模型，起播/跳转可能等待；按30秒窗口、最多提前约60秒运行。停止学习或切视频会取消当前任务，模型不会自动转写整部视频。设置和缓存按浏览器机制保存在浏览器配置目录；源码、服务、模型在E盘。</p></main><script src="options.js"></script></html>
